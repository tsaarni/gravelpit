# Keeping credentials in.
#
# One deny for everything hidden in $HOME, then the paths a toolchain needs. The allow rules
# win where they apply because they name more of the path.
#
# Written this way round because the deny list cannot be written. You do not know what every
# tool stores or where. The list of paths you need is knowable, because it is exactly what
# breaks, and the log names it:
#
#     gravelpit audit search --since 10m --verdict deny
#
# This works because $HOME is shaped conveniently: secrets live in hidden files, real work
# lives in ~/work, ~/go, ~/sdk, ~/wiki. Paths outside $HOME need no rules, because the ones
# holding secrets are owned by root and unreadable anyway.

- name: block-hidden-files
  action: read
  verdict: deny
  match: >
    pathMatch(path, "$HOME/.*") || pathMatch(path, "$HOME/.*/**")
  message: >
    Reading '${path}' is blocked by sandbox policy. Hidden files in the home directory
    are not readable unless a rule names them, because they usually hold credentials.
    This is not a permissions problem, so chmod will not help. If a tool really needs
    this file, say which tool and why, then carry on with something else.

# Two patterns: the hidden entry itself, and everything inside it. Both are needed, because
# opening a directory is an ordinary open, so `ls ~/.cache` matches the directory.

# --- The paths that are readable anyway. Add here when a tool breaks. ---------

- name: read-build-caches
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.cache/**") ||
    pathMatch(path, "$HOME/.npm/**") ||
    pathMatch(path, "$HOME/.gradle/caches/**") ||
    pathMatch(path, "$HOME/.m2/repository/**") ||
    pathMatch(path, "$HOME/.m2/settings.xml")

# ~/.m2 itself is not named, because ~/.m2/settings-security.xml holds the master password.
# ~/.cache is wide and some tools do cache tokens under it. Deliberate: it is the single
# biggest thing builds need.

- name: read-toolchains
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.cargo/registry/**") ||
    pathMatch(path, "$HOME/.cargo/bin/**") ||
    pathMatch(path, "$HOME/.cargo/env") ||
    pathMatch(path, "$HOME/.rustup/**") ||
    pathMatch(path, "$HOME/.nvm/**") ||
    pathMatch(path, "$HOME/.pyenv/**") ||
    pathMatch(path, "$HOME/.rbenv/**") ||
    pathMatch(path, "$HOME/.sdkman/**") ||
    pathMatch(path, "$HOME/.local/bin/**") ||
    pathMatch(path, "$HOME/.local/lib/**") ||
    pathMatch(path, "$HOME/.krew/**")

# ~/.cargo is not named, because ~/.cargo/credentials.toml holds a crates.io token.
# ~/.local is not named, because ~/.local/share/keyrings is inside it.

- name: read-tool-settings
  description: "One entry per tool, on purpose"
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.config/git/**") ||
    pathMatch(path, "$HOME/.config/go/**") ||
    pathMatch(path, "$HOME/.config/gh/config.yml") ||
    pathMatch(path, "$HOME/.gitconfig") ||
    pathMatch(path, "$HOME/.gitignore*") ||
    pathMatch(path, "$HOME/.terminfo/**") ||
    pathMatch(path, "$HOME/.docker/contexts/**") ||
    pathMatch(path, "$HOME/.kube/config") ||
    pathMatch(path, "$HOME/.bazelrc") ||
    pathMatch(path, "$HOME/.bazeliskrc")

# gh/config.yml is named, hosts.yml is not: that is where the GitHub token is. Same for
# .docker/contexts against .docker/config.json.
#
# ~/.kube/config holds cluster credentials and is readable anyway, because blocking it means
# no kubectl. Deliberate.

- name: read-agent-state
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.kiro/**") ||
    pathMatch(path, "$HOME/.agents/**") ||
    pathMatch(path, "$XDG_DATA_HOME/kiro-cli/**") ||
    pathMatch(path, "$XDG_STATE_HOME/runagent/**")

- name: read-ssh-public-parts
  description: "ssh config and public keys, never the private keys"
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.ssh/config") ||
    pathMatch(path, "$HOME/.ssh/known_hosts*") ||
    pathMatch(path, "$HOME/.ssh/*.pub")

# ~/.ssh/id_* is not named, so it stays blocked. This is workable because ssh signs through
# the agent socket without ever reading the key file.

- name: read-shell-startup
  description: "`bash -lc` reads these, and reading them is harmless"
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.profile") ||
    pathMatch(path, "$HOME/.bashrc") ||
    pathMatch(path, "$HOME/.bash_profile") ||
    pathMatch(path, "$HOME/.zshrc") ||
    pathMatch(path, "$HOME/.inputrc")

# Writing them is blocked in writes.yaml.

# --- The same secrets, over a socket ----------------------------------------
#
# Blocking the files on disk is not enough. The keyring daemons run outside the sandbox and
# hand back the same secrets over IPC.

- name: block-keyring-sockets
  action: connect
  verdict: deny
  match: >
    family == "AF_UNIX" && (
      pathMatch(socket, "/run/user/*/bus") ||
      socket == "/run/dbus/system_bus_socket" ||
      pathMatch(socket, "/run/user/*/at-spi/**") ||
      pathMatch(socket, "/run/user/*/kwallet*.socket") ||
      pathMatch(socket, "/run/user/*/keyring/**") ||
      pathMatch(socket, "/run/user/*/gcr/**") ||
      pathMatch(socket, "$HOME/.gnupg/S.*")
    )
  message: >
    The desktop keyring is blocked in this sandbox, so KWallet, gnome-keyring and
    gpg-agent cannot be reached. Any password a tool needs is already in its environment.

# D-Bus is the route to both KWallet and gnome-keyring, but blocking it is not enough:
# KWallet also listens on its own socket, and so does gnome-keyring.

- name: allow-keyring-ssh-agents
  action: connect
  verdict: allow
  match: >
    family == "AF_UNIX" && (
      pathMatch(socket, "/run/user/*/keyring/ssh") ||
      pathMatch(socket, "/run/user/*/gcr/ssh")
    )

# These two sit inside directories the rule above denies, and win by naming three more
# characters. They are agent sockets: they sign with a key without revealing it, which is
# what makes denying reads of ~/.ssh/id_* workable rather than crippling.

# ---------------------------------------------------------------------------
# What stays blocked because no rule names it. No deny rule needed:
#
#   ~/.ssh/id_*                    private keys
#   ~/.gnupg/**                    GPG keys
#   ~/.aws/**                      credentials
#   ~/.netrc                       passwords
#   ~/.npmrc                       npm registry token
#   ~/.cargo/credentials.toml      crates.io token
#   ~/.config/gh/hosts.yml         GitHub token
#   ~/.docker/config.json          registry logins
#   ~/.m2/settings-security.xml    Maven master password
#   ~/.local/share/keyrings/**     gnome-keyring
#   ~/.local/share/kwalletd/**     KWallet
#   ~/.config/google-chrome/**     cookies and saved passwords
#   ~/.mozilla/**                  same
#   ~/.bash_history                often has pasted secrets in it
#   ~/.newtool/token               anything installed later
#
# None of those is written down anywhere in this file. That is the point: they are blocked
# because nothing allowed them, not because somebody remembered them.
# ---------------------------------------------------------------------------
