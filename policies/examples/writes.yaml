# What the agent may change.
#
# write, delete and metadata start closed. This file lists where they are allowed.

- name: workspace-and-scratch
  action: [write, delete]
  verdict: allow
  match: >
    pathMatch(path, "$HOME/work/**") ||
    pathMatch(path, "$WORKDIR/**") ||
    pathMatch(path, "/tmp/**") ||
    pathMatch(path, "/var/tmp/**") ||
    pathMatch(path, "/dev/**")

- name: build-caches
  action: [write, delete]
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.cache/**") ||
    pathMatch(path, "$HOME/go/pkg/**") ||
    pathMatch(path, "$HOME/sdk/**") ||
    pathMatch(path, "$HOME/.m2/**") ||
    pathMatch(path, "$HOME/.npm/**") ||
    pathMatch(path, "$HOME/.cargo/registry/**") ||
    pathMatch(path, "$HOME/.gradle/caches/**") ||
    pathMatch(path, "$HOME/.docker/buildx/**")

- name: tool-state
  action: [write, delete]
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.config/**") ||
    pathMatch(path, "$HOME/.kube/**") ||
    pathMatch(path, "$HOME/.wget-hsts")

- name: known-hosts
  action: write
  verdict: allow
  match: pathMatch(path, "$HOME/.ssh/known_hosts")

- name: write-proc-self
  action: write
  verdict: allow
  match: pathMatch(path, "/proc/self/**")

# tool-state opens $HOME/.config/**, so gravelpit's own files need protection.
- name: protect-gravelpit-files
  action: [write, delete]
  verdict: deny
  match: >
    pathMatch(path, "$HOME/.config/gravelpit/**") ||
    pathMatch(path, "$HOME/.local/share/gravelpit/**")
  message: >
    Writing '${path}' is not allowed and cannot be worked around.

# --- metadata (chmod/chown) --------------------------------------------------

# Agents often try chmod after a permission error. This tells them it won't
# help, while chmod-in-writable-paths allows it where writing is permitted.
- name: chmod-wont-help
  action: metadata
  verdict: deny
  match: "true"
  message: >
    Changing permissions of '${path}' is not allowed. Access is decided by path,
    not file permissions.

- name: chmod-in-writable-paths
  action: metadata
  verdict: allow
  match: >
    pathMatch(path, "$HOME/work/**") ||
    pathMatch(path, "$WORKDIR/**") ||
    pathMatch(path, "/tmp/**") ||
    pathMatch(path, "/var/tmp/**") ||
    pathMatch(path, "$HOME/.cache/**") ||
    pathMatch(path, "$HOME/go/pkg/**") ||
    pathMatch(path, "$HOME/sdk/**")
