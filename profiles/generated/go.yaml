# Generated policy for go.
# Review and trim before committing.

- name: go-read
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.cache/go-build/**") ||
    pathMatch(path, "$HOME/.config/go/**") ||
    pathMatch(path, "$HOME/sdk/go1.27.0/**")


- name: go-write
  action: write
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.cache/go-build/**") ||
    pathMatch(path, "$HOME/.config/go/**")
