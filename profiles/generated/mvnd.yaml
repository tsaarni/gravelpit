# Generated policy for mvnd.
# Review and trim before committing.

- name: mvnd-read
  action: read
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.local/share/**") ||
    pathMatch(path, "$HOME/.m2/mvnd/**") ||
    pathMatch(path, "$HOME/.m2/repository/**")


- name: mvnd-write
  action: write
  verdict: allow
  match: >
    pathMatch(path, "$HOME/.m2/mvnd/**") ||
    pathMatch(path, "$HOME/.m2/repository/**")


- name: mvnd-delete
  action: delete
  verdict: allow
  match: pathMatch(path, "$HOME/.m2/repository/**")
